<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-lg border border-slate-100">
        <h2 class="text-3xl font-bold mb-6 text-indigo-700 text-center">Student Complaint Form</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Complaint Title</label>
                <input id="cTitle" type="text" placeholder="e.g., Broken Fan" 
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Category</label>
                <select id="cCategory" class="w-full p-3 border border-gray-300 rounded-lg outline-none">
                    <option>Hostel</option>
                    <option>Academic</option>
                    <option>Infrastructure</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Description</label>
                <textarea id="cDesc" placeholder="Describe the issue in detail..." 
                    class="w-full p-3 border border-gray-300 rounded-lg h-32 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                <p class="text-xs text-gray-400 mt-1">* Our AI will automatically analyze the priority of your request.</p>
            </div>

            <button id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-indigo-200">
                Submit Complaint
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
